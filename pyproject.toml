[project]
name = "kakehashi"
version = "0.2.0"
description = "ES-DE・同人ゲーム管理ツール"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "paramiko>=3.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # 旧tkinterアプリ（src/）用。Phase 5で削除する。
    "tkcalendar>=1.6.1",
]

[project.optional-dependencies]
ai = [
    "transformers>=4.46.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "accelerate>=1.0.0",
    "kornia>=0.8.0",
]
mcp = [
    "mcp>=1.0.0",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
kakehashi = "kakehashi.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kakehashi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
